// The boss of Stage 1's cul-de-sac, after the creator's sketch: a fat clown in a ragged pink teddy-

const parts = [];
// Add a geometry: transformed, fur-displaced (amount), coloured per vertex by fn(p, n) -> Color.

// a capsule-ish tapered limb from a to b (radii ra, rb)

const pinkFur = (p, n) => {

// --- legs: baggy pink pants, cream cuffs
for (const s of [-1, 1]) {
  const L1 = limb([s * 0.2, 0.78, 0], [s * 0.25, 0.3, 0.02], 0.24, 0.22);
  add(L1.g, pinkFur, { pos: L1.pos, quat: L1.quat, fur: 0.035 });
  add(new THREE.SphereGeometry(0.235, 16, 10), pinkFur, { pos: [s * 0.22, 0.52, 0.02], scl: [1, 1.15, 1], fur: 0.04 }); // the bag of the trouser leg
  add(new THREE.CylinderGeometry(0.2, 0.21, 0.09, 16, 1, true), (p, n) => bloodMix(CREAM.clone().lerp(CREAM_D, vnoise(p.x * 30, p.y * 30, p.z * 30)), p, n), { pos: [s * 0.25, 0.3, 0.02], fur: 0.02 });

  add(new THREE.SphereGeometry(0.2, 36, 24), boot, { pos: [s * 0.26, 0.11, 0.2], scl: [0.95, 0.62, 1.25] });
  add(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 20), (p) => C(0x2a1e18), { pos: [s * 0.26, 0.025, 0.12], scl: [0.95, 1, 1.6] });
  for (let k = 0; k < 4; k++) add(new THREE.BoxGeometry(0.16, 0.012, 0.02), () => C(0x3a2a20), { pos: [s * 0.25, 0.14 + k * 0.045, 0.165], rot: [0, 0, (k % 2 ? 0.4 : -0.4)] });

    if (Math.abs(bx2) < 0.09 && Math.abs(by2) < 0.12) c = C(0x5a6aa0).lerp(C(0x3a4a80), vnoise(p.x * 40, p.y * 40, 0));

  }

add(new THREE.SphereGeometry(0.56, 96, 64), bodyCol, { pos: [0, 0.98, 0.04], scl: [1.0, 0.95, 0.92], fur: 0.03 });
add(new THREE.SphereGeometry(0.46, 64, 32), bodyCol, { pos: [0, 1.34, -0.02], scl: [1.08, 0.62, 0.86], fur: 0.03 });

add(new THREE.SphereGeometry(0.075, 14, 10), pom(C(0xe8b828)), { pos: [0, 1.18, 0.55], fur: 0.03 });
add(new THREE.SphereGeometry(0.085, 14, 10), pom(C(0xe8b828)), { pos: [0, 0.94, 0.59], fur: 0.03 });
add(new THREE.SphereGeometry(0.13, 16, 10), pinkFur, { pos: [0, 0.8, -0.5], fur: 0.05 });
// --- the frilled collar: a wavy double ring, cream with a red trim, ragged
{
  const segs = 192, P = [], ring = (r, y, a) => [Math.cos(a) * r, y, Math.sin(a) * r];
  for (let i = 0; i < segs; i++) {

}

const HC = new THREE.Vector3(0, 1.8, 0.07);
const faceCol = (p, n) => {

add(new THREE.SphereGeometry(0.255, 72, 52), faceCol, { pos: HC.toArray(), scl: [1.12, 1.0, 1.0] });
add(new THREE.SphereGeometry(0.2, 48, 24), faceCol, { pos: [0, 1.62, 0.08], scl: [1.3, 0.55, 1.0] }); // jowls and double chin
add(new THREE.SphereGeometry(0.055, 14, 10), (p) => C(0xc01a1a).lerp(C(0xe85a4a), Math.max(0, p.y - 1.73) * 12), { pos: [0, 1.8, 0.34] });
{ // the hood: a pink shell round the face, open at the front

add(new THREE.SphereGeometry(0.1, 16, 10), (p, n) => bloodMix(CREAM.clone(), p, n, 0.5), { pos: [0, 2.08, 0.2], scl: [1.2, 0.8, 0.9] });
add(new THREE.SphereGeometry(0.04, 10, 8), () => C(0x141010), { pos: [0, 2.11, 0.285], scl: [1.3, 0.9, 0.8] });

  add(new THREE.SphereGeometry(0.13, 18, 12), pinkFur, { pos: [s * 0.25, 2.11, -0.03], scl: [1, 1, 0.55], fur: 0.03 });

}
// --- arms: shaggy sleeves (A-pose), cream cuffs, dirty gloves
for (const s of [-1, 1]) {
  const sh = [s * 0.42, 1.44, 0], el = [s * 0.66, 1.14, 0.02], wr = [s * 0.83, 0.88, 0.04];
  add(new THREE.SphereGeometry(0.2, 16, 12), pinkFur, { pos: [s * 0.42, 1.42, -0.01], fur: 0.04 });
  const a1 = limb(sh, el, 0.19, 0.16); add(a1.g, pinkFur, { pos: a1.pos, quat: a1.quat, fur: 0.04 });
  add(new THREE.SphereGeometry(0.16, 14, 10), pinkFur, { pos: el, fur: 0.04 });
  const a2 = limb(el, wr, 0.16, 0.14); add(a2.g, pinkFur, { pos: a2.pos, quat: a2.quat, fur: 0.04 });
  const cf = limb([s * 0.8, 0.92, 0.04], [s * 0.85, 0.85, 0.04], 0.135, 0.13); add(cf.g, (p, n) => bloodMix(CREAM.clone().lerp(CREAM_D, vnoise(p.x * 30, p.y * 30, p.z * 30)), p, n), { pos: cf.pos, quat: cf.quat, fur: 0.02 });
  const glove = (p, n) => bloodMix(C(0xd8cbb0).lerp(C(0x8a7a60), vnoise(p.x * 30, p.y * 30, p.z * 30) * 0.7), p, n, 1.2);
  add(new THREE.SphereGeometry(0.1, 14, 10), glove, { pos: [s * 0.87, 0.79, 0.05], scl: [0.8, 1.0, 1.1] });
  for (let f = 0; f < 4; f++) { const fz = -0.04 + f * 0.032; add(new THREE.CylinderGeometry(0.024, 0.02, 0.1, 8), glove, { pos: [s * 0.9, 0.7, 0.05 + fz], rot: [0, 0, s * 0.3] }); }
  add(new THREE.CylinderGeometry(0.024, 0.022, 0.08, 8), glove, { pos: [s * 0.84, 0.76, 0.13], rot: [0.9, 0, 0] });
}

const scene = new THREE.Scene();
for (const g of parts) scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })));
window.vertCount = parts.reduce((t, g) => t + g.attributes.position.count, 0);
// a preview render (front, side, back)
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(1200, 700); document.body.appendChild(R.domElement);
R.setClearColor(0xd8cfc0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x806050, 0.9)); const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(1, 2, 3); scene.add(dl);

};
window.ready = true;
